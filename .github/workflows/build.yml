name: build

on:
  push:
    branches: [ lwjgl3 ]
  pull_request:
    branches: [ lwjgl3 ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Compile
        run: |
          mkdir -p build
          javac -encoding UTF-8 -d build \
            -cp "lib/*" \
            $(find src -name '*.java')

      - name: Verify core algorithm
        run: java -cp build monolith.Verify

      - name: Package jar
        run: jar cfe monolith-finder.jar monolith.app.MonolithMapApp -C build .

      - name: Show result
        run: ls -lh monolith-finder.jar